# Mathesis Milestone 1 — versioned configuration (§62)
# Все experiment-dependent параметры живут здесь. Скрытые magic numbers запрещены.

lean:
  toolchain: "leanprover/lean4:v4.33.1"
  elan_home: ".tools/elan"
  package_dir: "lean/mathesis-lean"

validation:
  batch:
    # Timeout для одиночной batch-проверки (§12: TIMEOUT status)
    timeout_seconds: 60
    max_output_bytes: 1048576
  interactive:
    # Таймаут старта REPL-процесса (загрузка импортов)
    startup_timeout_seconds: 120
    # Таймаут одной action/verify
    action_timeout_seconds: 30
  # Доверенный набор kernel principles (§9). Всё остальное в proof pipeline запрещено.
  trusted_kernel_principles:
    - "Classical.choice"
    - "propext"
    - "Quot.sound"

safety:
  # Токены, запрещённые в proof pipeline (§9, §65)
  forbidden_tokens:
    - "sorry"
    - "admit"
    - "unsafe"
    - "native_decide"
  # Ключевые слова/декларации, запрещённые в обычном proof pipeline (§9, §10)
  forbidden_declarations:
    - "axiom"
    - "opaque"
    - "implemented_by"
    - "extern"
    - "macro_rules"
    - "syntax"
    - "elab"
    - "set_option"
  # Разрешённые импорты: только минимальный environment (§11)
  allowed_import_prefixes:
    - "Mathesis"
  # Паттерны ядра, использование которых должно протоколироваться
  restricted_patterns:
    - "Lean.ofReduceBool"
    - "Lean.ofReduceNat"

benchmark:
  # §16: batch vs interactive vs warm interactive на Tiny/Medium/Large
  sizes:
    tiny: 2      # число теорем в файле
    medium: 20
    large: 100
  batch_repeats: 5        # повторов batch-проверки каждого размера
  warm_runs: 10           # повторов warm interactive каждого размера
  # §17: throughput последовательных proof actions (реалистичные последовательности)
  throughput_actions: 60
  # Стоимость полного clean rebuild (§16)
  measure_clean_rebuild: true

logging:
  level: "INFO"
